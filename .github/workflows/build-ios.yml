name: build-ios

# 公开仓库下 macOS runner 免费（私有仓库才是 $0.062/分钟，且受账号额度限制）。
#
# 关于 runner 被秒取消：macos-14 镜像已进入弃用周期，部分账号/仓库会直接
# 拿不到 runner（表现为 runner_name 为空、0 个 step、started==completed）。
# 这里用 macos-latest（当前指向 macOS 15 镜像），避开已停止分配的老标签。
on:
  workflow_dispatch:
    inputs:
      make_ipa:
        description: '打包自签 IPA（关闭则只验证编译）'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['ios/**', 'core/mobile/**', 'core/provider/**', '.github/workflows/build-ios.yml']

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: core/go.sum

      - name: 工具链自检
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          go version

      - name: Go 单元测试
        working-directory: core
        run: |
          go vet ./...
          go test ./...

      - name: 准备 gomobile（GOPATH 模式）
        # 同 Android：x/mobile 源码铺进 GOPATH/src（保留它自己的 go.mod 和
        # vendor/，因为 gomobile 二进制会在子进程里重装 gobind），
        # 只有真正 bind 的那条命令用 GO111MODULE=off。
        # 不能在 /tmp 里 go mod init（系统临时目录下的 go.mod 被 Go 忽略）。
        #
        # x/mobile 必须钉版本：上游 @latest 已经要求 go>=1.26，会触发 toolchain
        # 自动切换，而下载 toolchain 常失败（stream error），job 直接挂。
        env:
          XMOBILE_VER: 'v0.0.0-20241204233305-ce44b2716d33'
        run: |
          set -euo pipefail
          GP="$(go env GOPATH)"
          go install "golang.org/x/mobile/cmd/gomobile@${XMOBILE_VER}"
          go install "golang.org/x/mobile/cmd/gobind@${XMOBILE_VER}"

          TMPMOD="$(mktemp -d)"
          ( cd "$TMPMOD" && go mod init tmp && go get "golang.org/x/mobile@${XMOBILE_VER}" >/dev/null )
          MODVER="$(cd "$TMPMOD" && go list -m -f '{{.Version}}' golang.org/x/mobile)"
          SRC="$(go env GOMODCACHE)/golang.org/x/mobile@${MODVER}"
          mkdir -p "$GP/src/golang.org/x"
          rm -rf "$GP/src/golang.org/x/mobile"
          cp -r "$SRC" "$GP/src/golang.org/x/mobile"
          chmod -R u+w "$GP/src/golang.org/x/mobile"
          ls "$GP/src/golang.org/x/mobile/bind" >/dev/null
          gomobile init
          echo "$GP/bin" >> "$GITHUB_PATH"

      - name: 仅验证编译（不打包）
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.make_ipa }}
        run: |
          GP="$(go env GOPATH)"
          mkdir -p "$GP/src/github.com/ElyYinLi/aipoints-mobile"
          ln -sfn "$PWD/core" "$GP/src/github.com/ElyYinLi/aipoints-mobile/core"
          ( cd "$GP/src/github.com/ElyYinLi/aipoints-mobile/core" && \
            GO111MODULE=off gomobile bind -target=ios -iosversion=15.0 -o /tmp/Mobile.xcframework ./mobile )
          ls -la /tmp/Mobile.xcframework

      - name: 构建 xcframework + .app + .ipa
        if: ${{ github.event_name == 'push' || inputs.make_ipa }}
        run: |
          bash ios/build-ipa.sh
          # IPA 没打出来就让这一步失败，避免 upload-artifact 报一个看不懂的
          # "no files found" 把真正的编译错误盖住
          test -s ios/build/Points.ipa

      - name: 产物信息
        if: ${{ github.event_name == 'push' || inputs.make_ipa }}
        run: |
          ls -lh ios/build/Points.ipa
          unzip -l ios/build/Points.ipa | head -20
          shasum -a 256 ios/build/Points.ipa

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' || inputs.make_ipa }}
        with:
          name: points-ipa
          path: ios/build/Points.ipa
          # 自签 IPA 下载即用，不需要长期占存储额度
          retention-days: 7
          if-no-files-found: error

      # Actions 产物要登录才能下载，而仓库是公开的：把 IPA 也挂到 Release 上，
      # 手机浏览器直接点链接就能拿到，不用登 GitHub。
      - name: 发布到 Release（公开直链）
        # 只在手动触发时发：push 触发的构建不覆盖用户正在用的发布版
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.make_ipa }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-latest"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "iOS 自签包" \
              --notes "自签 IPA，需用 SideStore / AltStore / Sideloadly 重签后安装。" --latest
          gh release upload "$TAG" ios/build/Points.ipa --clobber
