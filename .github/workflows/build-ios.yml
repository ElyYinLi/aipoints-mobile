name: build-ios

# ⚠️ 配额说明（很重要）
# GitHub Free 私有仓库每月 2000 分钟。macOS runner 按 **10× 倍率** 计费，
# 也就是每月只有 **200 分钟** 的 macOS 构建时间。一次完整 iOS 构建约 6-10 分钟，
# 所以每月大约 20 次构建。
#
# 因此这里刻意 **不在 push 时触发**，只保留 workflow_dispatch 手动触发：
#   Actions → build-ios → Run workflow
# 想临时放开自动构建，把下面注释掉的 push 段打开即可，但要盯着额度。
on:
  # push:
  #   branches: [main]
  #   paths: ['core/**', 'ios/**']
  workflow_dispatch:
    inputs:
      make_ipa:
        description: '同时打包自签 IPA'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum

      - name: Go 单元测试
        working-directory: core
        run: |
          go vet ./...
          go test ./...

      - name: 安装 Xcode 命令行工具链校验
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 构建 xcframework + .app + .ipa
        if: ${{ inputs.make_ipa }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash ios/build-ipa.sh

      - name: 仅验证 gomobile bind（不打包，省时间）
        if: ${{ !inputs.make_ipa }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          cd core && gomobile bind -target=ios -iosversion=15.0 -o /tmp/Mobile.xcframework ./mobile
          ls -la /tmp/Mobile.xcframework

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.make_ipa }}
        with:
          name: points-ipa
          path: ios/build/Points.ipa
          # 保留 1 天：自签 IPA 你自己下载下来就装了，不需要长期占存储额度
          retention-days: 1
          if-no-files-found: error
