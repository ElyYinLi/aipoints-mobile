name: build-ios

# 公开仓库下 macOS runner 也免费，不受额度限制（私有仓库才是 $0.062/分钟）。
# 但 iOS 构建耗时约 6-10 分钟且改动集中在 core/ 也会触发，所以仍然只做手动触发 +
# 路径变更自动触发，避免每次改 README 都跑一遍。
on:
  workflow_dispatch:
    inputs:
      make_ipa:
        description: '同时打包自签 IPA'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['ios/**', 'core/mobile/**', 'core/provider/**']

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum

      - name: Go 单元测试
        working-directory: core
        run: |
          go vet ./...
          go test ./...

      - name: 安装 Xcode 命令行工具链校验
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 构建 xcframework + .app + .ipa
        if: ${{ github.event_name == 'push' || inputs.make_ipa }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash ios/build-ipa.sh

      - name: 仅验证 gomobile bind（不打包，省时间）
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.make_ipa }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          cd core && gomobile bind -target=ios -iosversion=15.0 -o /tmp/Mobile.xcframework ./mobile
          ls -la /tmp/Mobile.xcframework

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' || inputs.make_ipa }}
        with:
          name: points-ipa
          path: ios/build/Points.ipa
          # 保留 1 天：自签 IPA 你自己下载下来就装了，不需要长期占存储额度
          retention-days: 1
          if-no-files-found: error
