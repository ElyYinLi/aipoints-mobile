name: build-android

# 仓库是公开的：标准托管 runner（Linux / macOS）在公开仓库下**完全免费**，
# 不消耗账号额度，所以每次 push 都能自动构建，iOS 也可以随便跑。
on:
  push:
    branches: [main]
    paths: ['core/**', 'android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Go 单元测试
        working-directory: core
        run: |
          go vet ./...
          go test ./...

      - name: 准备 gomobile（GOPATH 模式）
        # gomobile 在 module 模式下会强迫 core/go.mod 依赖 golang.org/x/mobile，
        # 而后者要求 go>=1.26，会把引擎的 go 指令一起抬高。这里改用 GOPATH 模式隔离。
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          GP="$(go env GOPATH)"
          MODVER="$(cd core && go list -m -f '{{.Version}}' golang.org/x/mobile 2>/dev/null || true)"
          if [ -z "$MODVER" ]; then
            # 未在 go.mod 里声明时，从模块缓存里取一份源码塞进 GOPATH/src
            cd /tmp
            go mod init tmp >/dev/null 2>&1 || true
            go get golang.org/x/mobile/bind@latest >/dev/null
            SRC="$(go env GOMODCACHE)/golang.org/x/mobile@${MODVER:-$(cd /tmp && go list -m -f '{{.Version}}' golang.org/x/mobile)}"
            mkdir -p "$GP/src/golang.org/x"
            cp -r "$SRC" "$GP/src/golang.org/x/mobile"
            rm -f "$GP/src/golang.org/x/mobile/go.mod" "$GP/src/golang.org/x/mobile/go.sum"
          fi
          gomobile init

      - name: 安装 Android SDK
        # runner 已自带 SDK，这里只确保 build-tools / platform / ndk 版本存在
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" > /dev/null

      - name: 还原签名密钥
        # 密钥不进公开仓库，从 Actions Secret 还原。
        # 缺 Secret 时构建仍会成功，但产出的是新密钥签名的包，覆盖安装会失败。
        env:
          KS_B64: ${{ secrets.POINTS_KEYSTORE_B64 }}
        run: |
          mkdir -p android/signing
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/signing/points.jks
            echo "已从 Secret 还原签名密钥"
          else
            echo "::warning::缺少 POINTS_KEYSTORE_B64，将使用临时密钥签名，产物不能覆盖安装"
            keytool -genkeypair -keystore android/signing/points.jks -storepass points2024 \
              -keypass points2024 -alias points -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Points, OU=Self, O=Self, L=Local, C=CN"
          fi

      - name: 构建 APK
        env:
          BUILD_TOOLS: '34.0.0'
          PLATFORM: 'android-34'
        run: bash android/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: points-apk
          path: android/build/Points.apk
          retention-days: 7
          if-no-files-found: error
