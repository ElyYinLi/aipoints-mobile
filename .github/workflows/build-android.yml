name: build-android

# 仓库是公开的：标准托管 runner 在公开仓库下完全免费、不消耗账号额度，
# 所以 push 就能自动出包。
on:
  push:
    branches: [main]
    paths: ['core/**', 'android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Go 单元测试
        working-directory: core
        run: |
          go vet ./...
          go test ./...

      - name: 准备 gomobile（GOPATH 模式）
        # gomobile bind 在 module 模式下会把 golang.org/x/mobile 拉进 core/go.mod，
        # 而新版本 x/mobile 要求 go>=1.24，会连带抬高引擎的 go 指令。
        # 这里把 x/mobile 源码放进 GOPATH/src 并用 GO111MODULE=off 运行，
        # 使 gomobile 自己的依赖与引擎的 go.mod 完全隔离。
        #
        # 坑：不能在 /tmp 里 `go mod init`——Go 直接忽略系统临时目录下的 go.mod，
        # 报 "go.mod file not found"（上一版构建就是卡在这里）。
        run: |
          set -euo pipefail
          GP="$(go env GOPATH)"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

          TMPMOD="$(mktemp -d)"
          ( cd "$TMPMOD" && go mod init tmp && go get golang.org/x/mobile/bind@latest >/dev/null )
          MODVER="$(cd "$TMPMOD" && go list -m -f '{{.Version}}' golang.org/x/mobile)"
          SRC="$(go env GOMODCACHE)/golang.org/x/mobile@${MODVER}"
          echo "x/mobile ${MODVER} -> $SRC"
          mkdir -p "$GP/src/golang.org/x"
          rm -rf "$GP/src/golang.org/x/mobile"
          cp -r "$SRC" "$GP/src/golang.org/x/mobile"
          chmod -R u+w "$GP/src/golang.org/x/mobile"
          rm -f "$GP/src/golang.org/x/mobile/go.mod" "$GP/src/golang.org/x/mobile/go.sum"
          GO111MODULE=off gomobile init
          # gomobile init 会为 ARM 交叉编译并预编译标准库，首次十几分钟；
          # 这一步失败时直接中止，后面的构建必然失败，报错也更清楚。
          ls "$GP/src/golang.org/x/mobile" >/dev/null

      - name: 安装 Android SDK 组件
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" > /dev/null

      - name: 还原签名密钥
        # 密钥不进公开仓库，从 Actions Secret 还原。
        # 缺 Secret 时构建仍会成功，但产出的是新密钥签名的包，覆盖安装会失败。
        env:
          KS_B64: ${{ secrets.POINTS_KEYSTORE_B64 }}
        run: |
          mkdir -p android/signing
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/signing/points.jks
            echo "已从 Secret 还原签名密钥"
          else
            echo "::warning::缺少 POINTS_KEYSTORE_B64，将使用临时密钥签名，产物不能覆盖安装"
            keytool -genkeypair -keystore android/signing/points.jks -storepass points2024 \
              -keypass points2024 -alias points -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Points, OU=Self, O=Self, L=Local, C=CN"
          fi

      - name: 构建 APK
        env:
          BUILD_TOOLS: '34.0.0'
          PLATFORM: 'android-34'
        run: bash android/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: points-apk
          path: android/build/Points.apk
          retention-days: 7
          if-no-files-found: error
