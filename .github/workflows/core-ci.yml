name: core-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Linux runner 按 1x 计费，引擎测试全在这跑，macOS 只留给打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: core/go.sum
      - name: gofmt 检查
        working-directory: core
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "以下文件未格式化:"; echo "$out"; exit 1; fi
      - name: 密钥扫描（含令牌/私钥一律拒绝）
        run: python3 tools/check_secrets.py .
      - name: go vet
        working-directory: core
        run: go vet ./...
      - name: 单元测试
        working-directory: core
        run: go test -race -cover ./...
      # 面板是一个上千行的内联 <script>，Go 编译器完全看不见它。
      # 曾经出现过「改模板时误删一个函数头」→ 整页 JS 语法错误 → 白屏，
      # 而所有 Go 测试仍然绿。这里把内联脚本抽出来交给 node 做真正的语法检查。
      - name: 面板内联 JS 语法检查
        run: |
          go build -o /tmp/pointsctl ./core/cmd/pointsctl
          /tmp/pointsctl -action serve -addr 127.0.0.1:7899 -dir /tmp/ci-data &
          SRV=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:7899/api/health > /dev/null; then break; fi
            sleep 0.3
          done
          curl -sf http://127.0.0.1:7899/ -o /tmp/page.html
          kill $SRV 2>/dev/null || true
          python3 tools/check_panel_js.py /tmp/page.html
      - name: 构建 CLI
        working-directory: core
        run: go build -o /tmp/pointsctl ./cmd/pointsctl && /tmp/pointsctl -action providers
